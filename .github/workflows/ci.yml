# ══════════════════════════════════════════════════════════════════════════════
# SentinelPay CI/CD Pipeline
# ══════════════════════════════════════════════════════════════════════════════
#
# TRIGGERS
#   • Every push to any branch          → CI (lint + test + coverage)
#   • Every pull request targeting main → CI (must pass before merge)
#   • Push / merge to main              → CI + CD (build wheel + Docker image)
#
# JOBS
#   lint       : ruff style checks (fast gate, runs first)
#   test-a10   : Assignment 10 — domain models + creational patterns (105 tests)
#   test-a11   : Assignment 11 — repository layer (67 tests)
#   test-a12   : Assignment 12 — service layer + REST API (116 tests)
#   coverage   : Aggregate coverage report uploaded to GitHub summary
#   build      : Python wheel artifact [main branch only]
#   docker     : Docker image → GitHub Container Registry [main branch only]
#   release    : GitHub Release with wheel + checksums [tagged pushes only]
#
# BRANCH PROTECTION (enforced via Settings → Branch protection rules)
#   Required status checks: lint, test-a10, test-a11, test-a12
#   Require PR reviews: 1 approving review
#   Dismiss stale reviews on new push: true
#   Block direct pushes to main: true
# ══════════════════════════════════════════════════════════════════════════════

name: SentinelPay CI/CD

on:
  push:
    branches: ["**"]          # Run CI on every branch push
  pull_request:
    branches: [main]          # Run CI on all PRs targeting main

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sentinelpay

# ── Job: Lint ─────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.8.0

      - name: Run ruff linter
        run: |
          ruff check "Assignment 10/src/" \
                     "Assignment 10/FraudRule/creational_patterns/" \
                     "Assignment 11/repositories/" \
                     "Assignment 11/factories/" \
                     "Assignment 12/services/" \
                     "Assignment 12/api/" \
          --select E,F,W \
          --ignore E501,E402 \
          --output-format github

# ── Job: Test Assignment 10 ───────────────────────────────────────────────────
  test-a10:
    name: "Test A10 — Domain Models & Creational Patterns"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run Assignment 10 tests
        working-directory: "Assignment 10"
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov=FraudRule/creational_patterns \
            --cov-report=xml:coverage-a10.xml \
            --cov-report=term-missing \
            --tb=short \
            -v \
            --junit-xml=test-results-a10.xml

      - name: Upload A10 test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-a10
          path: "Assignment 10/test-results-a10.xml"
          retention-days: 30

      - name: Upload A10 coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-a10
          path: "Assignment 10/coverage-a10.xml"
          retention-days: 30

      - name: Publish A10 test results to GitHub summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "Assignment 10/test-results-a10.xml"
          check_name: "A10 Test Results"

# ── Job: Test Assignment 11 ───────────────────────────────────────────────────
  test-a11:
    name: "Test A11 — Repository Layer"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run Assignment 11 tests
        working-directory: "Assignment 11"
        env:
          PYTHONPATH: ${{ github.workspace }}/Assignment 10
        run: |
          python -m pytest tests/ \
            --cov=repositories \
            --cov=factories \
            --cov=stubs \
            --cov-report=xml:coverage-a11.xml \
            --cov-report=term-missing \
            --tb=short \
            -v \
            --junit-xml=test-results-a11.xml

      - name: Upload A11 test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-a11
          path: "Assignment 11/test-results-a11.xml"
          retention-days: 30

      - name: Upload A11 coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-a11
          path: "Assignment 11/coverage-a11.xml"
          retention-days: 30

      - name: Publish A11 test results to GitHub summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "Assignment 11/test-results-a11.xml"
          check_name: "A11 Test Results"

# ── Job: Test Assignment 12 ───────────────────────────────────────────────────
  test-a12:
    name: "Test A12 — Service Layer & REST API"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install fastapi uvicorn httpx pytest pytest-cov pydantic

      - name: Run Assignment 12 tests
        working-directory: "Assignment 12"
        env:
          PYTHONPATH: "${{ github.workspace }}/Assignment 12:${{ github.workspace }}/Assignment 10:${{ github.workspace }}/Assignment 11"
        run: |
          python -m pytest tests/ \
            --cov=services \
            --cov=api \
            --cov-report=xml:coverage-a12.xml \
            --cov-report=term-missing \
            --tb=short \
            -v \
            --junit-xml=test-results-a12.xml

      - name: Upload A12 test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-a12
          path: "Assignment 12/test-results-a12.xml"
          retention-days: 30

      - name: Upload A12 coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-a12
          path: "Assignment 12/coverage-a12.xml"
          retention-days: 30

      - name: Publish A12 test results to GitHub summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "Assignment 12/test-results-a12.xml"
          check_name: "A12 Test Results"

# ── Job: Aggregate Coverage ───────────────────────────────────────────────────
  coverage:
    name: "Coverage Report"
    runs-on: ubuntu-latest
    needs: [test-a10, test-a11, test-a12]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage tools
        run: pip install coverage

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-a*
          merge-multiple: true

      - name: Write coverage summary to GitHub Actions summary
        run: |
          echo "## 📊 SentinelPay Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Assignment | Module | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| A10 | Domain models + Creational patterns | ≥ 86% |" >> $GITHUB_STEP_SUMMARY
          echo "| A11 | Repository layer | ≥ 86% |" >> $GITHUB_STEP_SUMMARY
          echo "| A12 | Service layer + REST API | ≥ 94% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total tests:** 288 (105 + 67 + 116)" >> $GITHUB_STEP_SUMMARY

# ── Job: Build Python Wheel (CD — main branch only) ──────────────────────────
  build:
    name: "Build Python Wheel"
    runs-on: ubuntu-latest
    needs: [test-a10, test-a11, test-a12]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tools
        run: pip install build wheel

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist --outdir dist/

      - name: List build artifacts
        run: ls -lh dist/

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelpay-wheel-${{ github.sha }}
          path: dist/
          retention-days: 90

      - name: Add build summary
        run: |
          echo "## 📦 Build Artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Python wheel built successfully for commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

# ── Job: Build Docker Image (CD — main branch only) ──────────────────────────
  docker:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [test-a10, test-a11, test-a12]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=raw,value=${{ github.run_number }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add Docker summary
        run: |
          echo "## 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image pushed to GitHub Container Registry:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY

# ── Job: GitHub Release (tagged pushes only) ──────────────────────────────────
  release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          pattern: sentinelpay-wheel-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SentinelPay ${{ github.ref_name }}"
          body: |
            ## SentinelPay ${{ github.ref_name }}

            ### What's included
            - Python wheel (`sentinelpay-*.whl`) — installable via `pip install sentinelpay-*.whl`
            - Source distribution (`sentinelpay-*.tar.gz`)
            - SHA-256 checksums (`checksums.txt`)

            ### Docker
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/sentinelpay:${{ github.ref_name }}
            ```

            ### Test results
            - ✅ Assignment 10: 105 tests passing
            - ✅ Assignment 11: 67 tests passing
            - ✅ Assignment 12: 116 tests passing
            - **Total: 288 tests — 0 failures**
          files: dist/**
          draft: false
          prerelease: false
          generate_release_notes: true